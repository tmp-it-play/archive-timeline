name: GOGO SP On-premise stage CD Workflow

on:
  push:
    branches:
      - 'develop'
  workflow_dispatch:

jobs:
  CI:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up JDK 17
        uses: actions/setup-java@v3
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Setup Gradle
        uses: gradle/gradle-build-action@v2

      - name: Setup Gradle's permission
        run: chmod +x gradlew

      - name: Build with Gradle
        run: ./gradlew clean build

  deploy:
    needs: CI
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.0.3
        env:
          INFRA_HOST: ${{ secrets.INFRA_HOST }}
          DB_USER: ${{ secrets.DB_USER }}
          DB_PASSWORD: ${{ secrets.DB_PASSWORD }}
        with:
          host: ${{ secrets.STAGE_ON_PREMISE_HOST }}
          username: ubuntu
          password: ${{ secrets.STAGE_ON_PREMISE_PASSWORD }}
          envs: INFRA_HOST,DB_USER,DB_PASSWORD
          script: |
            set -e

            mkdir -p /home/ubuntu/gogo-sp
            cd /home/ubuntu/gogo-sp

            if [ ! -d ".git" ]; then
              git clone -b develop https://github.com/team-gogo/gogo-sp.git .
            else
              git pull origin develop
            fi

            ./gradlew clean build

            docker build -f DockerFileStage -t gogo-sp-stage .

            docker stop gogo-sp-stage || true
            docker rm gogo-sp-stage || true

            docker run -d -p 8085:8085 \
              -e "EUREKA_HOSTNAME=${INFRA_HOST}" \
              -e "DB_URL=${INFRA_HOST}:3306" \
              -e "DB_NAME=gogo-sp" \
              -e "DB_USER=${DB_USER}" \
              -e "DB_PASSWORD=${DB_PASSWORD}" \
              -e "DDL_AUTO=validate" \
              --name gogo-sp-stage gogo-sp-stage

      - name: SSH Success Notification
        if: success()
        uses: sarisia/actions-status-discord@v1
        with:
          webhook: ${{ secrets.DISCORD_WEBHOOK }}
          color: 0x4CAF50
          title: "배포 성공"
          message: "GOGO SP On-premise stage deployment completed successfully."

      - name: SSH Failure Notification
        if: failure()
        uses: sarisia/actions-status-discord@v1
        with:
          webhook: ${{ secrets.DISCORD_WEBHOOK }}
          color: 0xFF4C4C
          title: "배포 실패"
          message: "GOGO SP On-premise stage deployment failed. Check the logs for details."