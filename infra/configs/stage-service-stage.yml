server:
  port: 8082

spring:
  datasource:
    url: jdbc:mysql://host.docker.internal:3306/gogo-stage?useSSL=false&characterEncoding=UTF-8&serverTimezone=Asia/Seoul&allowPublicKeyRetrieval=true
    username: ${DB_USER:root}
    password: ${DB_PASSWORD:CHANGE_ME}
    driver-class-name: com.mysql.cj.jdbc.Driver
  jpa:
    database-platform: org.hibernate.dialect.MySQLDialect
    hibernate:
      ddl-auto: ${DDL_AUTO:validate}
    properties:
      hibernate:
        default_batch_fetch_size: 1000
  data:
    redis:
      host: host.docker.internal
      port: 6379
  kafka:
    bootstrap-servers: host.docker.internal:9092
  cloud:
    aws:
      credentials:
        access-key: ${AWS_ACCESS_KEY:CHANGE_ME}
        secret-key: ${AWS_SECRET_KEY:CHANGE_ME}
      region:
        static: ap-northeast-2
      s3:
        bucket: ${S3_BUCKET:CHANGE_ME}

eureka:
  instance:
    prefer-ip-address: true
  client:
    register-with-eureka: true
    fetch-registry: true
    service-url:
      defaultZone: http://host.docker.internal:8761/eureka/

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  metrics:
    export:
      prometheus:
        enabled: true
