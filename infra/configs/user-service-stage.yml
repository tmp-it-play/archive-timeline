server:
  port: 8081

spring:
  datasource:
    url: jdbc:mysql://${INFRA_DOMAIN}:3306/gogo-user?useSSL=false&characterEncoding=UTF-8&serverTimezone=Asia/Seoul&allowPublicKeyRetrieval=true
    username: root
    password: ${DB_PASSWORD}
    driver-class-name: com.mysql.cj.jdbc.Driver
  jpa:
    database-platform: org.hibernate.dialect.MySQLDialect
    show-sql: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        default_batch_fetch_size: 1000
  data:
    redis:
      host: ${INFRA_DOMAIN}
      port: 6379
  kafka:
    bootstrap-servers: ${INFRA_DOMAIN}:9092
    consumer:
      group-id: user-service
      auto-offset-reset: earliest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.apache.kafka.common.serialization.StringDeserializer
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.StringSerializer
  security:
    oauth2:
      client:
        registration:
          google:
            client-id: CHANGE_ME
            client-secret: CHANGE_ME
            scope: email, profile

eureka:
  instance:
    prefer-ip-address: true
  client:
    register-with-eureka: true
    fetch-registry: true
    service-url:
      defaultZone: http://${INFRA_DOMAIN}:8761/eureka/

oauth:
  google:
    info-url: https://www.googleapis.com

security:
  jwt:
    token:
      accessSecret: CHANGE_ME
      refreshSecret: CHANGE_ME
      accessExp: CHANGE_ME
      refreshExp: CHANGE_ME
  internal:
    serverToServerIp: CHANGE_ME
    serverToServerSubnet: CHANGE_ME

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  metrics:
    export:
      prometheus:
        enabled: true
