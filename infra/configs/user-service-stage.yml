server:
  port: 8081

spring:
  datasource:
    url: jdbc:mysql://host.docker.internal:3306/gogo-user?useSSL=false&characterEncoding=UTF-8&serverTimezone=Asia/Seoul&allowPublicKeyRetrieval=true
    username: root
    password: CHANGE_ME
    driver-class-name: com.mysql.cj.jdbc.Driver
  jpa:
    database-platform: org.hibernate.dialect.MySQLDialect
    show-sql: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        default_batch_fetch_size: 1000
  data:
    redis:
      host: host.docker.internal
      port: 6379
  kafka:
    bootstrap-servers: host.docker.internal:9092
    consumer:
      group-id: user-service
      auto-offset-reset: earliest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.apache.kafka.common.serialization.StringDeserializer
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.StringSerializer
  security:
    oauth2:
      client:
        registration:
          google:
            client-id: CHANGE_ME
            client-secret: CHANGE_ME
            scope: email, profile

eureka:
  instance:
    prefer-ip-address: true
  client:
    register-with-eureka: true
    fetch-registry: true
    service-url:
      defaultZone: http://host.docker.internal:8761/eureka/

# JWT 설정 (security.jwt.token.* 프리픽스)
security:
  jwt:
    token:
      accessSecret: CHANGE_ME      # 액세스 토큰 서명 키
      refreshSecret: CHANGE_ME     # 리프레시 토큰 서명 키
      accessExp: CHANGE_ME         # 액세스 토큰 만료 시간 (ms 단위)
      refreshExp: CHANGE_ME        # 리프레시 토큰 만료 시간 (ms 단위)
  internal:
    serverToServerIp: CHANGE_ME    # 서버 간 통신 허용 IP
    serverToServerSubnet: CHANGE_ME

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  metrics:
    export:
      prometheus:
        enabled: true
