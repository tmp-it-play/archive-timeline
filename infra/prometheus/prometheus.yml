global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: 'gogo-user'
    metrics_path: /actuator/prometheus
    static_configs:
      - targets: ['10.0.0.130:8081']
        labels:
          service: 'gogo-user'

  - job_name: 'gogo-shop'
    metrics_path: /actuator/prometheus
    static_configs:
      - targets: ['10.0.0.130:8084']
        labels:
          service: 'gogo-shop'

  - job_name: 'gogo-stage'
    metrics_path: /actuator/prometheus
    static_configs:
      - targets: ['10.0.0.132:8082']
        labels:
          service: 'gogo-stage'

  - job_name: 'gogo-betting'
    metrics_path: /actuator/prometheus
    static_configs:
      - targets: ['10.0.0.132:8083']
        labels:
          service: 'gogo-betting'

  - job_name: 'gogo-sp'
    metrics_path: /actuator/prometheus
    static_configs:
      - targets: ['10.0.0.133:8085']
        labels:
          service: 'gogo-sp'