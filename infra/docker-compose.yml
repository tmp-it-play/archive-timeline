version: '3.8'

# ================================================================
# 사용법:
#   1. cp .env.example .env  →  .env 파일에 실제 값 입력
#   2. docker compose up -d  →  인프라+플랫폼+모니터링 전체 기동
#
# Prometheus가 각 앱 서버를 스크래핑하려면 .env에서
# GOGO_*_HOST 값을 채운 뒤 아래 명령으로 설정을 주입하세요:
#   envsubst < prometheus/prometheus.yml > prometheus/prometheus.resolved.yml
# ================================================================

networks:
  gogo-network:
    driver: bridge

volumes:
  mysql_data:
  redis_data:
  kafka_data:
  prometheus_data:
  grafana_data:
  loki_data:

services:

  # ──────────────────────────────────────────
  # 데이터베이스
  # ──────────────────────────────────────────
  mysql:
    image: mysql:8.0.28
    container_name: gogo-mysql
    restart: always
    ports:
      - "3306:3306"
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      TZ: Asia/Seoul
    volumes:
      - mysql_data:/var/lib/mysql
      - ./mysql/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    command: >
      --character-set-server=utf8mb4
      --collation-server=utf8mb4_unicode_ci
      --default-time-zone=+09:00
    networks:
      - gogo-network
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ──────────────────────────────────────────
  # 캐시
  # ──────────────────────────────────────────
  redis:
    image: redis:7-alpine
    container_name: gogo-redis
    restart: always
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - gogo-network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ──────────────────────────────────────────
  # 메시지 브로커
  # ──────────────────────────────────────────
  zookeeper:
    image: confluentinc/cp-zookeeper:7.6.0
    container_name: gogo-zookeeper
    restart: always
    ports:
      - "2181:2181"
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
      TZ: Asia/Seoul
    networks:
      - gogo-network

  kafka:
    image: confluentinc/cp-kafka:7.6.0
    container_name: gogo-kafka
    restart: always
    ports:
      - "9092:9092"
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:9092
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://${INFRA_DOMAIN}:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      TZ: Asia/Seoul
    volumes:
      - kafka_data:/var/lib/kafka/data
    depends_on:
      - zookeeper
    networks:
      - gogo-network

  # ──────────────────────────────────────────
  # 플랫폼 (서비스 디스커버리 + 설정 서버)
  # ──────────────────────────────────────────
  eureka:
    build:
      context: ../gogo-eureka
      dockerfile: Dockerfile
    image: gogo-eureka:latest
    container_name: gogo-eureka
    restart: always
    ports:
      - "8761:8761"
    environment:
      TZ: Asia/Seoul
    networks:
      - gogo-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8761/actuator/health"]
      interval: 30s
      timeout: 10s
      retries: 5

  config:
    build:
      context: ../gogo-config
      dockerfile: Dockerfile
    image: gogo-config:latest
    container_name: gogo-config
    restart: always
    ports:
      - "8888:8888"
    environment:
      TZ: Asia/Seoul
      # 아래 두 변수는 Config Server 자신이 사용하는 게 아니라
      # 클라이언트 서비스들이 Config Server로부터 받은 설정값을 해석할 때 참조함
      # (앱 컨테이너에 -e로 직접 주입되므로 여기서는 참고용)
      DB_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      INFRA_DOMAIN: ${INFRA_DOMAIN}
    volumes:
      - ./configs:/config:ro
    networks:
      - gogo-network
    depends_on:
      - mysql
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8888/actuator/health"]
      interval: 30s
      timeout: 10s
      retries: 5

  # ──────────────────────────────────────────
  # 모니터링
  # ──────────────────────────────────────────
  prometheus:
    image: prom/prometheus:latest
    container_name: gogo-prometheus
    restart: always
    ports:
      - "9090:9090"
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--storage.tsdb.retention.time=15d'
      - '--web.enable-lifecycle'
      - '--web.external-url=/prometheus'
      - '--web.route-prefix=/'
    networks:
      - gogo-network

  grafana:
    image: grafana/grafana:latest
    container_name: gogo-grafana
    restart: always
    ports:
      - "3000:3000"
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_PASSWORD:-admin}
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_SERVER_ROOT_URL: "%(protocol)s://%(domain)s:%(http_port)s/grafana/"
      GF_SERVER_SERVE_FROM_SUB_PATH: "true"
      TZ: Asia/Seoul
    volumes:
      - grafana_data:/var/lib/grafana
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
    depends_on:
      - prometheus
      - loki
    networks:
      - gogo-network

  loki:
    image: grafana/loki:2.9.0
    container_name: gogo-loki
    user: "0"
    restart: always
    ports:
      - "3100:3100"
    volumes:
      - ./loki/loki-config.yml:/etc/loki/loki-config.yml:ro
      - loki_data:/loki
    command: -config.file=/etc/loki/loki-config.yml
    networks:
      - gogo-network
