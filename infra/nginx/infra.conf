upstream gogo-eureka {
    server localhost:8761;
}

upstream gogo-grafana {
    server localhost:3000;
}

upstream gogo-prometheus {
    server localhost:9090;
}

server {
    listen 80;
    server_name _;

    location /eureka/ {
        proxy_pass http://gogo-eureka/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }

    location /grafana/ {
        proxy_pass http://gogo-grafana/grafana/;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }

    location /prometheus/ {
        proxy_pass http://gogo-prometheus/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 60s;
    }

    location /health {
        return 200 'infra healthy';
        add_header Content-Type text/plain;
    }
}