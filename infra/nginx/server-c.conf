# Server C: gogo-sp(8085) + gogo-minigame(8086)

upstream gogo-sp {
    server localhost:8085;
}

upstream gogo-minigame {
    server localhost:8086;
}

server {
    listen 80;
    server_name _;

    # gogo-sp 라우팅
    location /api/sp/ {
        proxy_pass http://gogo-sp/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }

    # gogo-minigame HTTP 라우팅
    location /api/minigame/ {
        proxy_pass http://gogo-minigame/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }

    # gogo-minigame WebSocket 라우팅
    location /ws/ {
        proxy_pass http://gogo-minigame/ws/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    # Health check
    location /health {
        return 200 'server-c healthy';
        add_header Content-Type text/plain;
    }
}
