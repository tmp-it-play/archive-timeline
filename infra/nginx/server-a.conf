# Server A: gogo-user(8081) + gogo-shop(8084)

upstream gogo-user {
    server localhost:8081;
}

upstream gogo-shop {
    server localhost:8084;
}

server {
    listen 80;
    server_name _;

    # gogo-user 라우팅
    location /api/user/ {
        proxy_pass http://gogo-user/api/user/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }

    # gogo-shop 라우팅
    location /api/shop/ {
        proxy_pass http://gogo-shop/api/shop/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }

    # Health check
    location /health {
        return 200 'server-a healthy';
        add_header Content-Type text/plain;
    }
}
