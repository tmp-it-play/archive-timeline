name: CD - gogo-sp

on:
  push:
    branches: ['develop']
    paths:
      - 'gogo-sp/**'
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3

      - name: Deploy to Server C
        uses: appleboy/ssh-action@v1.0.3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          INFRA_DOMAIN: ${{ secrets.INFRA_DOMAIN }}
          DB_PASSWORD: ${{ secrets.DB_PASSWORD }}
          JWT_ACCESS_SECRET: ${{ secrets.JWT_ACCESS_SECRET }}
          APP_SERVER_C_IP: ${{ secrets.APP_SERVER_C_IP }}
        with:
          host: ${{ secrets.APP_SERVER_C_DOMAIN }}
          port: 27110
          username: ubuntu
          password: ${{ secrets.APP_SERVER_C_PASSWORD }}
          envs: INFRA_DOMAIN,DB_PASSWORD,GITHUB_TOKEN,JWT_ACCESS_SECRET,APP_SERVER_C_IP
          script: |
            set -e
            mkdir -p /home/ubuntu/gogo
            cd /home/ubuntu/gogo
            export GIT_TERMINAL_PROMPT=0
            git config --global credential.helper ''

            if [ ! -d ".git" ]; then
              git clone -b develop https://x-access-token:${GITHUB_TOKEN}@github.com/snowykte0426/gogo.git .
            else
              git fetch https://x-access-token:${GITHUB_TOKEN}@github.com/snowykte0426/gogo.git develop
              git reset --hard FETCH_HEAD
            fi
            cd gogo-sp
            chmod +x gradlew
            ./gradlew clean build -x test
            docker build -f DockerFileStage -t gogo-sp-stage .
            docker stop gogo-sp-stage || true
            docker rm gogo-sp-stage || true
            docker run -d -p 8085:8085 \
              -e "EUREKA_HOSTNAME=${INFRA_DOMAIN}" \
              -e "DB_URL=${INFRA_DOMAIN}:3306" \
              -e "DB_NAME=gogo-sp" \
              -e "DB_USER=root" \
              -e "DB_PASSWORD=${DB_PASSWORD}" \
              -e "JWT_ACCESS_SECRET=${JWT_ACCESS_SECRET}" \
              -e "DDL_AUTO=update" \
              -e "INSTANCE_IP=${APP_SERVER_C_IP}" \
              -e "EUREKA_INSTANCE_IPADDRESS=${APP_SERVER_C_IP}" \
              --name gogo-sp-stage gogo-sp-stage
            # Promtail 시작/갱신 (로그 → Loki)
            docker stop gogo-promtail 2>/dev/null || true
            docker rm gogo-promtail 2>/dev/null || true
            docker run -d \
              -v /var/run/docker.sock:/var/run/docker.sock \
              -v /var/lib/docker/containers:/var/lib/docker/containers:ro \
              -v /tmp/promtail-positions:/tmp \
              -v /home/ubuntu/gogo/infra/promtail/promtail-config.yml:/etc/promtail/config.yml:ro \
              -e "LOKI_ADDR=${INFRA_DOMAIN}" \
              --name gogo-promtail \
              grafana/promtail:2.9.0 \
              -config.file=/etc/promtail/config.yml \
              -config.expand-env=true

      - name: Success Notification
        if: success()
        uses: sarisia/actions-status-discord@v1
        with:
          webhook: ${{ secrets.DISCORD_WEBHOOK }}
          color: 0x4CAF50
          title: "배포 성공"
          message: "gogo-sp (Server C) 배포 완료"

      - name: Failure Notification
        if: failure()
        uses: sarisia/actions-status-discord@v1
        with:
          webhook: ${{ secrets.DISCORD_WEBHOOK }}
          color: 0xFF4C4C
          title: "배포 실패"
          message: "gogo-sp (Server C) 배포 실패"
