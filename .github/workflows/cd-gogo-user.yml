name: CD - gogo-user

on:
  push:
    branches: ['develop']
    paths:
      - 'gogo-user/**'
  workflow_dispatch:

jobs:
  CI:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: gogo-user
    steps:
      - uses: actions/checkout@v3
      - uses: actions/setup-java@v3
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle
      - uses: gradle/gradle-build-action@v2
        with:
          build-root-directory: gogo-user
      - run: chmod +x gradlew
      - run: ./gradlew clean build -x test

  deploy:
    needs: CI
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3

      - name: Deploy to Server A
        uses: appleboy/ssh-action@v1.0.3
        env:
          INFRA_DOMAIN: ${{ secrets.INFRA_DOMAIN }}
          DB_PASSWORD: ${{ secrets.DB_PASSWORD }}
        with:
          host: ${{ secrets.APP_SERVER_A_DOMAIN }}
          port: 27107
          username: ubuntu
          password: ${{ secrets.APP_SERVER_A_PASSWORD }}
          envs: INFRA_DOMAIN,DB_PASSWORD
          script: |
            set -e
            mkdir -p /home/ubuntu/gogo
            cd /home/ubuntu/gogo
            if [ ! -d ".git" ]; then
              git clone -b develop https://github.com/snowykte0426/gogo.git .
            else
              git pull origin develop
            fi
            cd gogo-user
            chmod +x gradlew
            ./gradlew clean build -x test
            docker build -f DockerFileStage -t gogo-user-stage .
            docker stop gogo-user-stage || true
            docker rm gogo-user-stage || true
            docker run -d -p 8081:8081 \
              -e "INFRA_DOMAIN=${INFRA_DOMAIN}" \
              -e "DB_PASSWORD=${DB_PASSWORD}" \
              --name gogo-user-stage gogo-user-stage

      - name: Success Notification
        if: success()
        uses: sarisia/actions-status-discord@v1
        with:
          webhook: ${{ secrets.DISCORD_WEBHOOK }}
          color: 0x4CAF50
          title: "배포 성공"
          message: "gogo-user (Server A) 배포 완료"

      - name: Failure Notification
        if: failure()
        uses: sarisia/actions-status-discord@v1
        with:
          webhook: ${{ secrets.DISCORD_WEBHOOK }}
          color: 0xFF4C4C
          title: "배포 실패"
          message: "gogo-user (Server A) 배포 실패"
