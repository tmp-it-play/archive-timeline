name: CD - infra

on:
  push:
    branches: ['develop']
    paths:
      - 'infra/**'
      - 'gogo-eureka/**'
      - 'gogo-config/**'
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v3

      - name: Deploy infra via SSH
        uses: appleboy/ssh-action@v1.0.3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          host: ${{ secrets.INFRA_ONPRE_DOMAIN }}
          port: 27108
          username: ubuntu
          password: ${{ secrets.INFRA_ONPRE_PASSWORD }}
          envs: GITHUB_TOKEN
          script: |
            set -e
            mkdir -p /home/ubuntu/gogo
            cd /home/ubuntu/gogo

            export GIT_TERMINAL_PROMPT=0
            git config --global credential.helper ''

            if [ ! -d ".git" ]; then
              git clone -b develop https://x-access-token:${GITHUB_TOKEN}@github.com/snowykte0426/gogo.git .
            else
              git fetch https://x-access-token:${GITHUB_TOKEN}@github.com/snowykte0426/gogo.git develop
              git reset --hard FETCH_HEAD
            fi

            # Nginx 설정 적용
            sudo cp nginx/infra.conf /etc/nginx/sites-available/gogo.conf
            sudo ln -sf /etc/nginx/sites-available/gogo.conf /etc/nginx/sites-enabled/gogo.conf
            sudo nginx -t && sudo systemctl reload nginx

            cd infra
            docker compose build eureka config
            docker compose up -d

      - name: Success Notification
        if: success()
        uses: sarisia/actions-status-discord@v1
        with:
          webhook: ${{ secrets.DISCORD_WEBHOOK }}
          color: 0x4CAF50
          title: "인프라 배포 성공"
          message: "인프라 스택(Eureka, Config, MySQL, Kafka, Grafana 등)이 업데이트되었습니다."

      - name: Failure Notification
        if: failure()
        uses: sarisia/actions-status-discord@v1
        with:
          webhook: ${{ secrets.DISCORD_WEBHOOK }}
          color: 0xFF4C4C
          title: "인프라 배포 실패"
          message: "인프라 배포에 실패했습니다. 로그를 확인하세요."
