name: CD - gogo-minigame

on:
  push:
    branches: ['develop']
    paths:
      - 'gogo-minigame/**'
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3

      - name: Deploy to Server C
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.APP_SERVER_C_DOMAIN }}
          port: 27110
          username: ubuntu
          password: ${{ secrets.APP_SERVER_C_PASSWORD }}
          script: |
            set -e
            mkdir -p /home/ubuntu/gogo
            cd /home/ubuntu/gogo
            export GIT_TERMINAL_PROMPT=0
            git config --global credential.helper ''

            if [ ! -d ".git" ]; then
              git clone -b develop https://github.com/snowykte0426/gogo.git .
            else
              git fetch origin develop
              git reset --hard origin/develop
            fi
            cd gogo-minigame
            docker build --network=host -t gogo-minigame-stage .
            docker stop gogo-minigame-stage || true
            docker rm gogo-minigame-stage || true
            docker run -d -p 8086:8086 \
              --env-file /home/ubuntu/.env.minigame \
              --name gogo-minigame-stage gogo-minigame-stage

      - name: Success Notification
        if: success()
        uses: sarisia/actions-status-discord@v1
        with:
          webhook: ${{ secrets.DISCORD_WEBHOOK }}
          color: 0x4CAF50
          title: "배포 성공"
          message: "gogo-minigame (Server C) 배포 완료"

      - name: Failure Notification
        if: failure()
        uses: sarisia/actions-status-discord@v1
        with:
          webhook: ${{ secrets.DISCORD_WEBHOOK }}
          color: 0xFF4C4C
          title: "배포 실패"
          message: "gogo-minigame (Server C) 배포 실패"
