name: CD - gogo-shop

on:
  push:
    branches: ['develop']
    paths:
      - 'gogo-shop/**'
  workflow_dispatch:

jobs:
  CI:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: gogo-shop
    steps:
      - uses: actions/checkout@v3
      - uses: actions/setup-java@v3
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle
      - uses: gradle/gradle-build-action@v2
        with:
          build-root-directory: gogo-shop
      - run: chmod +x gradlew
      - run: ./gradlew clean build

  deploy:
    needs: CI
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3

      - name: Deploy to Server A
        uses: appleboy/ssh-action@v1.0.3
        env:
          INFRA_HOST: ${{ secrets.INFRA_HOST }}
          DB_PASSWORD: ${{ secrets.DB_PASSWORD }}
        with:
          host: ${{ secrets.APP_SERVER_A_HOST }}
          username: ubuntu
          password: ${{ secrets.APP_SERVER_A_PASSWORD }}
          envs: INFRA_HOST,DB_PASSWORD
          script: |
            set -e
            mkdir -p /home/ubuntu/gogo
            cd /home/ubuntu/gogo
            if [ ! -d ".git" ]; then
              git clone -b develop https://github.com/snowykte0426/gogo.git .
            else
              git pull origin develop
            fi
            cd gogo-shop
            chmod +x gradlew
            ./gradlew clean build
            docker build -f DockerFileStage -t gogo-shop-stage .
            docker stop gogo-shop-stage || true
            docker rm gogo-shop-stage || true
            docker run -d -p 8084:8084 \
              --add-host host.docker.internal:${INFRA_HOST} \
              -e "DB_PASSWORD=${DB_PASSWORD}" \
              --name gogo-shop-stage gogo-shop-stage

      - name: Success Notification
        if: success()
        uses: sarisia/actions-status-discord@v1
        with:
          webhook: ${{ secrets.DISCORD_WEBHOOK }}
          color: 0x4CAF50
          title: "배포 성공"
          message: "gogo-shop (Server A) 배포 완료"

      - name: Failure Notification
        if: failure()
        uses: sarisia/actions-status-discord@v1
        with:
          webhook: ${{ secrets.DISCORD_WEBHOOK }}
          color: 0xFF4C4C
          title: "배포 실패"
          message: "gogo-shop (Server A) 배포 실패"
