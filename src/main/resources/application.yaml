spring:
  application:
    name: hot-place-research
  datasource:
    driver-class-name: com.mysql.jdbc.Driver
    url: jdbc:mysql://${RDB_HOST:localhost}:${RDB_PORT:3306}/${RDB_SCHEMA:hot_place_research}?useSSL=false
    username: ${RDB_USER:root}
    password: ${RDB_PASSWORD}
  jpa:
    hibernate:
      ddl-auto: ${RDB_DDL-AUTO:update}
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQLDialect
        format_sql: true
  cloud:
    openfeign:
      httpclient:
        connection-timeout: 5000
        ok-http:
          read-timeout: 150s
naver:
  url:
    search:
      local: https://openapi.naver.com/v1/search/local.json
      image: https://openapi.naver.com/v1/search/image
  client:
    id: ${NAVER_CLIENT_ID}
    secret: ${NAVER_CLIENT_SECRET}
feign:
  client:
    config:
      default:
        connectTimeout: 5000   # 연결시도 타임아웃 (ms)
        readTimeout: 120000    # 읽기(응답대기) 타임아웃 (ms)
ai:
  service:
    url: http://localhost:8001
