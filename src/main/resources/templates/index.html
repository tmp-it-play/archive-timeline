<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>ㄹㅈㄷ 맛집탐방</title>
    <link href="/css/style.css" rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body data-theme="light">
<header>
    <h1>ㄹㅈㄷ 맛집탐방</h1>
    <button class="toggle-btn" id="theme-toggle">다크 모드 전환</button>
</header>
<main>
    <div class="search-container">
        <div class="search-bar">
            <input type="text" id="search-query" placeholder="검색어를 입력하세요..."/>
            <button id="search-btn">검색</button>
        </div>
        <div class="category-filter">
            <select id="category-filter">
                <option value="">전체 카테고리</option>
            </select>
        </div>
        <div class="api-toggle">
            <button class="api-btn active" data-api="search">일반 검색</button>
            <button class="api-btn" data-api="dbSearch">DB 검색</button>
            <button class="api-btn" data-api="cross">교차 검색</button>
        </div>
    </div>
    <div id="results" class="results-container"></div>
</main>
<script src="/js/script.js"></script>
</body>
</html>
