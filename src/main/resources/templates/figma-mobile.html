<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>빅데이터 - 맛집 추천 앱</title>
    <link rel="stylesheet" href="/css/figma-mobile.css">
</head>
<body>
    <div class="mobile-container">
        <!-- 온보딩 화면 -->
        <div class="onboarding-screen" id="onboarding">
            <h1 class="onboarding-title">오늘을 더 맛있게<br>오늘을 더 행복하게</h1>
            <p class="onboarding-subtitle">내 취향으로 나만의 맛집지도를 만들다</p>
            <div class="onboarding-images">
                <div class="food-image">🍽️</div>
                <div class="food-image">🍜</div>
            </div>
        </div>

        <!-- 메인 화면 -->
        <div class="main-screen" id="main">
            <div class="main-header">
                <div class="page-indicator">
                    <div class="dot"></div>
                    <div class="dot active"></div>
                    <div class="dot"></div>
                    <div class="dot"></div>
                    <div class="dot"></div>
                </div>
                <div class="search-container">
                    <div class="search-bar">
                        <svg class="search-icon" viewBox="0 0 24 24" fill="currentColor">
                            <path d="M15.5 14h-.79l-.28-.27C15.41 12.59 16 11.11 16 9.5 16 5.91 13.09 3 9.5 3S3 5.91 3 9.5 5.91 16 9.5 16c1.61 0 3.09-.59 4.23-1.57l.27.28v.79l5 4.99L20.49 19l-4.99-5zm-6 0C7.01 14 5 11.99 5 9.5S7.01 5 9.5 5 14 7.01 14 9.5 11.99 14 9.5 14z"/>
                        </svg>
                        <input type="text" class="search-input" placeholder="먹고 싶은 메뉴나 가게를 검색해 주세요">
                    </div>
                </div>
            </div>

            <div class="content-area">
                <div class="promotion-banner">🎯</div>

                <div class="recommendation-section">
                    <h2 class="section-title">오늘의 우리동네 추천</h2>
                    <div class="restaurant-list" id="todayRecommendations">
                        <div class="loading-container">
                            <div class="loading"></div>
                        </div>
                    </div>
                </div>

                <div class="recommendation-section">
                    <h2 class="section-title">나의 또간집</h2>
                    <div class="restaurant-list" id="favoriteRestaurants">
                        <div class="loading-container">
                            <div class="loading"></div>
                        </div>
                    </div>
                </div>

                <div class="recommendation-section">
                    <h2 class="section-title">오늘의 블루리본 추천</h2>
                    <div class="restaurant-list" id="blueRibbonRecommendations">
                        <div class="loading-container">
                            <div class="loading"></div>
                        </div>
                    </div>
                </div>

                <div class="recommendation-section">
                    <h2 class="section-title">카테고리</h2>
                    <div class="category-grid">
                        <div class="category-item" data-category="도시락">
                            <div class="category-icon">🍱</div>
                            <div class="category-name">도시락</div>
                        </div>
                        <div class="category-item" data-category="디저트">
                            <div class="category-icon">🧁</div>
                            <div class="category-name">디저트</div>
                        </div>
                        <div class="category-item" data-category="한식">
                            <div class="category-icon">🍚</div>
                            <div class="category-name">한식</div>
                        </div>
                        <div class="category-item" data-category="일식">
                            <div class="category-icon">🍜</div>
                            <div class="category-name">일식</div>
                        </div>
                        <div class="category-item" data-category="양식">
                            <div class="category-icon">🍝</div>
                            <div class="category-name">양식</div>
                        </div>
                        <div class="category-item" data-category="초밥">
                            <div class="category-icon">🍣</div>
                            <div class="category-name">초밥, 회</div>
                        </div>
                        <div class="category-item" data-category="아시안">
                            <div class="category-icon">🥡</div>
                            <div class="category-name">아시안</div>
                        </div>
                        <div class="category-item" data-category="샌드위치">
                            <div class="category-icon">🥪</div>
                            <div class="category-name">샌드위치</div>
                        </div>
                        <div class="category-item" data-category="샐러드">
                            <div class="category-icon">🥗</div>
                            <div class="category-name">샐러드</div>
                        </div>
                        <div class="category-item" data-category="카페">
                            <div class="category-icon">☕</div>
                            <div class="category-name">카페</div>
                        </div>
                        <div class="category-item" data-category="피자">
                            <div class="category-icon">🍕</div>
                            <div class="category-name">피자</div>
                        </div>
                        <div class="category-item" data-category="치킨">
                            <div class="category-icon">🍗</div>
                            <div class="category-name">치킨</div>
                        </div>
                        <div class="category-item" data-category="햄버거">
                            <div class="category-icon">🍔</div>
                            <div class="category-name">햄버거</div>
                        </div>
                        <div class="category-item" data-category="빵">
                            <div class="category-icon">🥐</div>
                            <div class="category-name">빵</div>
                        </div>
                    </div>
                </div>
            </div>

            <div class="bottom-nav">
                <a href="#" class="nav-item">
                    <div class="nav-icon">🗺️</div>
                    <div class="nav-label">맛집지도</div>
                </a>
                <a href="#" class="nav-item active">
                    <div class="nav-icon">🏠</div>
                    <div class="nav-label">홈</div>
                </a>
                <a href="#" class="nav-item">
                    <div class="nav-icon">👤</div>
                    <div class="nav-label">마이페이지</div>
                </a>
            </div>
        </div>
    </div>

    <script src="/js/figma-mobile.js"></script>
</body>
</html>
